<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">

            <div class="col-md-6">
                <h2 class="text-center bg-light p-2">School Office Hours</h2>
                <hr>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover text-center">
                        <thead class="table-primary">
                            <tr>
                                <th>Day</th>
                                <th>Office Hours</th>
                                <th>Department</th>

                            <tr>

                                <td>7:00AM-3:00PM</td>

                            </tr>
                            <tr>

                                <td>7:00AM-3:00PM</td>

                            <tr>

            </div>

            <div class="col-md-5 forms bg-white">

                    <br>

                    <br>
                     <label for="fname"> Email Address: </label>
                    <br>
                    <input type="text" id="fname" name="fname" placeholder="Enter your Email Address">
                    <br> <label for="fname"> Subject: </label>
                    <br>
                    <input type="text" id="fname" name="fname" placeholder="Enter your Subject">
                    <br>
                    <label for="feedback"> Share your feedback here: </label>
                    <br>
                    <textarea id="feedback" name="Feedback" rows="4" cols="50" placeholder="type here..."> </textarea>
                    <br>
                    <input class="text-center button" type="submit" value="Submit">
                </form>
